openapi: 3.0.0
info:
  title: Tuk Tracker API
  version: 1.0.0
  description: Coursework API for tracking tuk-tuks, routes, schedules, and live locations.
servers:
  - url: http://localhost:5000
paths:
  /health:
    get:
      summary: Health check
      responses:
        '200':
          description: API is running
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
  /api/auth/login:
    post:
      summary: Admin login
      description: Authenticate admin and receive JWT token to access protected endpoints.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
            examples:
              admin:
                value: { "username": "admin", "password": "admin123" }
      responses:
        '200':
          description: Authentication successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
        '401':
          description: Invalid credentials
  /api/routes:
    get:
      summary: List all routes
      responses:
        '200':
          description: Array of route objects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Route'
    post:
      summary: Create a route (admin)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RouteInput'
            examples:
              example:
                value: { "routeCode": "R1", "name": "Downtown Loop", "origin": "Station A", "destination": "Station B", "stops": ["Stop 1","Stop 2"], "distanceKm": 12.5 }
      responses:
        '201':
          description: Route created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Route'
        '401':
          description: Unauthorized
  /api/routes/{id}:
    get:
      summary: Get a route by ID
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Route resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Route'
        '404':
          description: Route not found

  /api/tuks:
    get:
      summary: List tuk-tuks
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [On Route, Stopped, Delayed]
        - in: query
          name: route
          description: Filter by route ObjectId
          schema:
            type: string
      responses:
        '200':
          description: Array of tuk-tuks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Tuk'
    post:
      summary: Create a tuk (admin)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TukInput'
            examples:
              example:
                value: { "tukId": "TUK001", "registration": "ABC-123", "route": "<routeObjectId>", "driverName": "Driver A" }
      responses:
        '201':
          description: Tuk-tuk created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tuk'
        '401':
          description: Unauthorized

  /api/tuks/{id}:
    get:
      summary: Get tuk-tuk by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Tuk-tuk resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tuk'
        '404':
          description: Not found
    patch:
      summary: Update a tuk-tuk (admin)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TukInput'
      responses:
        '200':
          description: Updated tuk-tuk
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tuk'
        '401':
          description: Unauthorized
    delete:
      summary: Delete a tuk-tuk (admin)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '204':
          description: Tuk-tuk deleted
        '401':
          description: Unauthorized

  /api/tuks/{id}/location:
    get:
      summary: Get current location of a tuk
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Current location
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Location'
    post:
      summary: Update a tuk's location (admin/operator)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LocationUpdate'
            examples:
              example:
                value: { "latitude": 6.9271, "longitude": 79.8612 }
      responses:
        '200':
          description: Location updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
        '401':
          description: Unauthorized

  /api/locations/bulk-update:
    post:
      summary: Bulk update locations (admin)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/BulkLocationUpdateItem'
            examples:
              example:
                value:
                  - { "tukId": "TUK001", "latitude": 6.9271, "longitude": 79.8612 }
                  - { "tukId": "TUK002", "latitude": 6.9300, "longitude": 79.8550 }
      responses:
        '200':
          description: Bulk update results
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        tukId:
                          type: string
                        ok:
                          type: boolean

  /api/master-data/provinces:
    get:
      summary: List all nine provinces
      responses:
        '200':
          description: Province master data
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Province'
  /api/master-data/districts:
    get:
      summary: List districts, optionally filtered by province
      parameters:
        - in: query
          name: province
          schema:
            type: string
      responses:
        '200':
          description: District master data
  /api/master-data/stations:
    get:
      summary: List police stations, optionally filtered by district
      parameters:
        - in: query
          name: district
          schema:
            type: string
      responses:
        '200':
          description: Police station master data
  /api/history:
    get:
      summary: Query movement history
      parameters:
        - in: query
          name: tukId
          schema:
            type: string
        - in: query
          name: from
          schema:
            type: string
            format: date-time
        - in: query
          name: to
          schema:
            type: string
            format: date-time
        - in: query
          name: limit
          schema:
            type: integer
            default: 100
            maximum: 1000
      responses:
        '200':
          description: Location history points

  /api/tuks/{id}/history:
    get:
      summary: Get movement history for one tuk-tuk
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - in: query
          name: from
          schema:
            type: string
            format: date-time
        - in: query
          name: to
          schema:
            type: string
            format: date-time
        - in: query
          name: limit
          schema:
            type: integer
            default: 100
            maximum: 1000
      responses:
        '200':
          description: Tuk movement history

components:
  parameters:
    ResourceId:
      in: path
      name: id
      required: true
      schema:
        type: string
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Login:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
      required: [username, password]

    Route:
      type: object
      properties:
        _id:
          type: string
        routeCode:
          type: string
        name:
          type: string
        origin:
          type: string
        destination:
          type: string
        stops:
          type: array
          items:
            type: string
        distanceKm:
          type: number

    RouteInput:
      type: object
      properties:
        routeCode:
          type: string
        name:
          type: string
        origin:
          type: string
        destination:
          type: string
        stops:
          type: array
          items:
            type: string
        distanceKm:
          type: number
      required: [routeCode]

    Tuk:
    type: object
    properties:
      _id:
        type: string
      tukId:
        type: string
      registration:
        type: string
      deviceId:
        type: string
      province:
        $ref: '#/components/schemas/Province'
      district:
        $ref: '#/components/schemas/District'
      policeStation:
        $ref: '#/components/schemas/PoliceStation'
      route:
        $ref: '#/components/schemas/Route'
      driverName:
        type: string
      currentLocation:
        $ref: '#/components/schemas/Location'
      status:
        type: string
      schedule:
        type: array
        items:
          type: object
          properties:
            tripDate:
              type: string
              format: date-time
            departureTime:
              type: string
            arrivalTime:
              type: string

    Province:
      type: object
      properties:
        _id:
          type: string
        code:
          type: string
        name:
          type: string

    District:
      type: object
      properties:
        _id:
          type: string
        code:
          type: string
        name:
          type: string
        province:
          $ref: '#/components/schemas/Province'

    PoliceStation:
      type: object
      properties:
        _id:
          type: string
        stationCode:
          type: string
        name:
          type: string
        district:
          $ref: '#/components/schemas/District'
        location:
          $ref: '#/components/schemas/Location'

  TukInput:
    type: object
    properties:
      tukId:
        type: string
      registration:
        type: string
      route:
        type: string
      driverName:
        type: string
        deviceId:
          type: string
        province:
          type: string
        district:
          type: string
        policeStation:
          type: string
    required: [tukId, registration, deviceId, province, district, policeStation]

  Location:
    type: object
    properties:
      latitude:
        type: number
      longitude:
        type: number
      timestamp:
        type: string
        format: date-time

  LocationUpdate:
    type: object
    properties:
      latitude:
        type: number
      longitude:
        type: number
    required: [latitude, longitude]

  BulkLocationUpdateItem:
    type: object
    properties:
      tukId:
        type: string
      latitude:
        type: number
      longitude:
        type: number
    required: [tukId, latitude, longitude]
