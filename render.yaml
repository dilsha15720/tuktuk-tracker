services:
  - type: web
    name: tuktuk-tracker-api
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        sync: false
      - key: REQUIRE_MONGODB
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: REFRESH_TOKEN_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        sync: false
      - key: ADMIN_USER
        sync: false
      - key: ADMIN_PASS
        sync: false
      - key: ADMIN_PASS_HASH
        sync: false
      - key: OPERATOR_USER
        sync: false
      - key: OPERATOR_PASS
        sync: false
      - key: OPERATOR_PASS_HASH
        sync: false
      - key: PROVINCIAL_USER
        sync: false
      - key: PROVINCIAL_PASS_HASH
        sync: false
      - key: PROVINCIAL_PROVINCE_ID
        sync: false
      - key: STATION_USER
        sync: false
      - key: STATION_PASS_HASH
        sync: false
      - key: STATION_ID
        sync: false
      - key: STATION_DISTRICT_ID
        sync: false
      - key: OPERATOR_STATION_ID
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: PUBLIC_URL
        sync: false
